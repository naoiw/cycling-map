name: Sync naoiw AI rules

# Manual-only rollout. workflow_dispatch is available from the repository default branch.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    uses: naoiw/.github/.github/workflows/reusable-sync-ai-rules.yml@495524d0ef4b8418566782a569de6c34a9d63ce2
    with:
      source-ref: main

# Sync updates only <!-- naoiw:managed:start/end --> blocks in agent instruction files.
# Local instructions outside the managed markers are preserved.
# GitHub Settings > Actions > General must allow Actions to create pull requests.
