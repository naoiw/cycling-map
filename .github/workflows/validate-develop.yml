name: Validate develop

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: naoiw/.github/.github/workflows/reusable-node-ci.yml@3f1b5f2dedeca0bbdd2cf640b4ab189fa28b77fb
    with:
      package-manager: pnpm
      node-version: "26"
      pnpm-version: "9.14.2"
      run-lint: false
      run-typecheck: false
      run-tests: true
      run-build: true
